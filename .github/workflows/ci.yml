name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testar e empacotar
        run: ./mvnw -B verify

      - name: Resumo da cobertura
        if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR > 1 { perdidas += $8; cobertas += $9 }
            END { printf "### Cobertura de linhas: %.1f%%\n", 100 * cobertas / (perdidas + cobertas) }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  docker:
    name: Imagem Docker
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build (e publicação na main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
