spring:
  application:
    name: obrigacoes-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/obrigacoes?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:obrigacoes}
    password: ${DB_PASSWORD:obrigacoes}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  fuso-horario: ${APP_FUSO_HORARIO:America/Sao_Paulo}
  anexos:
    diretorio: ${APP_ANEXOS_DIRETORIO:storage/anexos}
    tamanho-maximo: ${APP_ANEXOS_TAMANHO_MAXIMO:10MB}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
